name: "Advance android version actions"
description: "This action will increment the version code/name/stage directly in build.gradle . "
inputs:
  gradlePath:
    description: "Gradle path to override version"
    required: true
    default: "app/build.gradle"
  versionCode:
    description: "The new version code"
    required: false
  versionCodeLimiter:
    description: "Limit to the last digest when adding to the version name"
    required: false
  versionName:
    description: "The new version name"
    required: false
  versionStage:
    description: "The stage of the app"
    required: false
  versionMetaInfo:
    description: "Added meta info to the end of the version"
    required: false
outputs:
  result: # id of output
    description: "Action Result"
  lastestVersionCode:
    description: "Version Code"
  latestVersionName:
    description: "Version Name"
  latestVersionNameWithoutStage:
    description: "Version Name without stage"
runs:
  using: "composite"
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', github.action_path)) }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      shell: bash
      run: npm install --production
      working-directory: ${{ github.action_path }}

    - name: Run action
      shell: bash
      run: node ${{ github.action_path }}/index.js
      env:
        INPUT_GRADLEPATH: ${{ inputs.gradlePath }}
        INPUT_VERSIONCODE: ${{ inputs.versionCode }}
        INPUT_VERSIONCODELIMITER: ${{ inputs.versionCodeLimiter }}
        INPUT_VERSIONNAME: ${{ inputs.versionName }}
        INPUT_VERSIONSTAGE: ${{ inputs.versionStage }}
        INPUT_VERSIONMETAINFO: ${{ inputs.versionMetaInfo }}
        GITHUB_OUTPUT: ${{ github.output }}
        GITHUB_STATE: ${{ github.state }}
